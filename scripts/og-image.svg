<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fefae0"/>

  <!-- Frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#283618" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Eyebrow -->
  <text x="88" y="140" font-family="Source Code Pro, DejaVu Sans Mono, monospace" font-size="22" letter-spacing="4" fill="#606c38">FULL STACK ENGINEER</text>

  <!-- Name -->
  <text x="84" y="258" font-family="Playfair Display, Georgia, DejaVu Serif, serif" font-size="104" font-weight="500" fill="#000000">Prince Bavishi</text>

  <!-- Rule -->
  <line x1="88" y1="300" x2="700" y2="300" stroke="#283618" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="88" cy="300" r="5" fill="#606c38"/>

  <!-- Summary -->
  <text x="88" y="358" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#283618">Angular · TypeScript · Node.js · Core Java</text>
  <text x="88" y="404" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" fill="#283618" fill-opacity="0.72">Building production web applications end to end.</text>

  <!-- Location -->
  <text x="88" y="524" font-family="Source Code Pro, DejaVu Sans Mono, monospace" font-size="20" letter-spacing="2" fill="#283618" fill-opacity="0.6">RAJKOT, GUJARAT, INDIA</text>

  <!-- Isometric stack mark, right side -->
  <g transform="translate(880, 200)">
    <g stroke="#283618" stroke-width="2" fill="#606c38" fill-opacity="0.08">
      <polygon points="100,0 200,48 100,96 0,48"/>
      <polygon points="100,58 200,106 100,154 0,106"/>
      <polygon points="100,116 200,164 100,212 0,164"/>
    </g>
    <g fill="#606c38">
      <circle cx="0" cy="48" r="5"/><circle cx="200" cy="48" r="5"/>
      <circle cx="0" cy="106" r="5"/><circle cx="200" cy="106" r="5"/>
      <circle cx="0" cy="164" r="5"/><circle cx="200" cy="164" r="5"/>
    </g>
  </g>
</svg>
